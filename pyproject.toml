[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "netlab"
version = "1.0.0"
description = "Local-first network analysis for LinkedIn connection exports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tehau Debarthe" }]
keywords = ["network-analysis", "linkedin", "graph", "data-science", "privacy", "local-first"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
# The analytics core is intentionally dependency-free. Only the optional HTTP server
# pulls third-party packages, so `pip install netlab` stays trivial in locked-down
# environments and the CLI works with nothing but the standard library.
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = [
  "netlab[server]",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
netlab = "netlab.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/linkedin-network-lab"
Issues = "https://github.com/your-org/linkedin-network-lab/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/netlab"]

[tool.hatch.build.targets.wheel.force-include]
"src/netlab/web" = "netlab/web"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["ignore::DeprecationWarning"]
timeout = 120

[tool.coverage.run]
source = ["netlab"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]

[tool.mypy]
python_version = "3.10"
packages = ["netlab"]
mypy_path = "src"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
