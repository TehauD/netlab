name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test · py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Node powers the cross-engine parity test only; the suite skips it if absent.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest --cov=netlab --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  lint:
    name: lint · ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src/netlab

  guard:
    name: guard · no personal data committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A real Connections.csv must never reach the repository. Fail loudly if one does.
      - name: Reject committed connection exports
        run: |
          if git ls-files | grep -Ei '(^|/)connections.*\.csv$'; then
            echo "::error::A LinkedIn export appears to be committed. Remove it and rewrite history."
            exit 1
          fi
          echo "No export files tracked."

  build:
    name: build · wheel
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      # Confirm the static UI actually ships inside the wheel.
      - name: Verify web assets are packaged
        run: |
          python -m zipfile -l dist/*.whl | grep -q "netlab/web/index.html"
          echo "Web assets present in wheel."
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
